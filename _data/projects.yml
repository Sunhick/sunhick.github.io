- category: "Developer Tools"
  title: "restclient-sigv4"
  description: "Signs restclient.el requests with AWS Signature Version 4 and 4A, so you can call AWS APIs straight from Emacs. Covers single-region HMAC and multi-region ECDSA signing, with unit and property-based tests."
  url: "https://github.com/Sunhick/restclient-sigv4"
  technologies: ["Emacs Lisp", "SigV4", "ECDSA"]

