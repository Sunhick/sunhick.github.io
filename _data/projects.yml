# Projects shown on the Portfolio tab and in the terminal's `ls projects`.
# Keep this to a handful of significant projects. Every `url` must be a real
# public repo at https://github.com/Sunhick.
#
# Fields:
#   category      small label on the card
#   title         project name
#   description   one or two sentences
#   url           source repo (optional if there's a writeup)
#   writeup       site path to a related blog post (optional)
#   technologies  short tags

- category: "Hardware"
  title: "TOTEM wireless split keyboard"
  description: "A 38-key Bluetooth split keyboard I built and flashed with ZMK and the Miryoku layout, including battery reporting for both halves."
  writeup: "/posts/totem-bluetooth-split-keyboard-build/"
  technologies: ["ZMK", "nRF52840", "Bluetooth"]

- category: "Security"
  title: "ToyWebAuthN"
